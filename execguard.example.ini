; execguard example configuration
;
; Each section is either an absolute path to a binary (single-binary rule),
; or a group label with a 'paths' key listing multiple binaries (named group).
; Use either 'allowed' or 'denied' (mutually exclusive).
; Multi-line values: each line is one range entry.
;
; Syntax per entry:
;   [Year] [Month[,Month...|Month-Month]] [DOM[,DOM...|DOM-DOM] | Weekday[,Weekday...|Weekday-Weekday]] HH:MM-HH:MM
;
; Year:        4-digit integer           e.g. 2027
; Month:       3-letter name             e.g. Jan, Jan-Jun, Jan,Jul
; Weekday:     3-letter name (Mon-Sun)   e.g. Mon, Mon-Fri, Mon,Wed,Fri
; Day-of-month: 1-2 digit integer        e.g. 15, 1-15, 1,15,20
; Time:        HH:MM-HH:MM               e.g. 08:00-16:00, 22:00-06:00 (overnight)
;
; DOM and Weekday are mutually exclusive per entry.
; All fields except Time are optional (omitting = wildcard).

; Block during school hours, log only (don't actually deny)
[/usr/bin/discord]
denied = 09:00-17:00
log-only = true

; Block Mon-Fri school hours Jan-Jun and Aug-Dec; July is free
[/usr/games/minecraft]
denied =
    Jan-Jun Mon-Fri 08:00-16:00
    Aug-Dec Mon-Fri 08:00-16:00

; Allow only Saturdays in January and July
[/usr/bin/game]
allowed =
    Jan,Jul Sat 00:00-23:59

; Block overnight in July too
[/usr/bin/example]
denied =
    Jan-Jun Mon-Fri 08:00-16:00
    Aug-Dec Mon-Fri 08:00-16:00
    Jul 22:00-06:00

; Allow only on July 15th 10:00-12:00 (recurring annual)
[/usr/bin/special]
allowed =
    Jul 15 10:00-12:00

; One-time: allow only on January 10th 2027
[/usr/bin/once]
allowed =
    2027 Jan 10 09:00-10:00

; Named group: share one rule across multiple binaries
[steam-launchers]
paths =
    /usr/bin/steam
    /usr/lib/steam/steam
allowed = Mon-Fri 18:00-22:00
